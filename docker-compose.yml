services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    # worker.py runs as PID 1 and only reaps the children it spawns itself.
    # Camoufox's Firefox subprocesses outlive tech_analysis.py, get reparented
    # here, and accumulate as zombies until the container's PID cgroup is
    # exhausted — after which Firefox can no longer fork and every tech scan
    # fails with SCAN_ERROR. tini as PID 1 reaps them.
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    depends_on:
      - backend

volumes:
  data:
